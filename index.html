<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Space Taxi</title>
<script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
<style>
  @font-face { font-family: Outfit; src: url("fonts/outfit-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: Outfit; src: url("fonts/outfit-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }
  @font-face { font-family: Outfit; src: url("fonts/outfit-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body {
    margin: 0; width: 100%; height: 100%; background: #08090f; overflow: hidden;
    touch-action: none; font-family: Outfit, system-ui, sans-serif;
  }
  #stage {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: #08090f;
  }
  #game {
    position: relative;
    width: 100%;
    height: 100%;
  }
  canvas { display: block; width: 100%; height: 100%; background: #08090f; outline: none; }
  #hint {
    position: absolute; left: 0; right: 0; bottom: 14px;
    text-align: center; color: rgba(244,247,255,.55);
    font: 600 13px Outfit, system-ui, sans-serif;
    pointer-events: none; display: none;
  }
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 20;
    background: #08090f; color: #fff6d6;
    align-items: center; justify-content: center; text-align: center;
    flex-direction: column; gap: 22px;
    font: 600 22px Outfit, system-ui, sans-serif; padding: 24px;
  }
  #rotate .phone {
    width: 86px; height: 52px; border: 3px solid #ffe08a; border-radius: 10px;
    position: relative; animation: tilt 1.4s ease-in-out infinite;
  }
  #rotate .phone:after {
    content: ""; position: absolute; right: -8px; top: 18px;
    width: 4px; height: 14px; border-radius: 2px; background: #ffe08a;
  }
  @keyframes tilt {
    0%, 100% { transform: rotate(0deg); }
    40% { transform: rotate(90deg); }
    60% { transform: rotate(90deg); }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="game">
    <canvas id="c"></canvas>
    <div id="hint">arrows or hold around the taxi</div>
  </div>
  <div id="rotate">
    <div class="phone"></div>
    Turn your device sideways
  </div>
</div>
<script>
(() => {
  const W = 1280, H = 720;

  const ctx = canvas.getContext("2d");
  canvas.tabIndex = 0;
  const view = { dpr: 1, scale: 1, ox: 0, oy: 0, vw: W, vh: H, portrait: false, fill: false, worldScale: 1, camX: 0, camY: 0 };

  function touchPlay() {
    return matchMedia("(pointer: coarse)").matches || matchMedia("(hover: none)").matches;
  }
  const gameEl = document.getElementById("game");
  const rotateEl = document.getElementById("rotate");
  const hintEl = document.getElementById("hint");
  hintEl.style.display = "none";
  function viewSize() {
    const vv = window.visualViewport;
    if (vv && vv.width && vv.height) return { vw: vv.width, vh: vv.height };
    return { vw: window.innerWidth, vh: window.innerHeight };
  }
  function isPortrait() {
    const { vw, vh } = viewSize();
    return vh > vw * 1.08;
  }
  function fitStage() {
    const { vw, vh } = viewSize();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.max(1, Math.round(vw * dpr));
    canvas.height = Math.max(1, Math.round(vh * dpr));
    canvas.style.width = vw + "px";
    canvas.style.height = vh + "px";
    const scale = Math.min(vw / W, vh / H);
    view.dpr = dpr;
    view.scale = scale;
    view.ox = (vw - W * scale) / 2;
    view.oy = (vh - H * scale) / 2;
    view.vw = vw;
    view.vh = vh;
    view.portrait = vh > vw * 1.08;
    view.cover = !view.portrait;
    rotateEl.style.display = view.portrait ? "flex" : "none";
  }
  function jobPad() {
    const n = wantPad();
    if (!n) return null;
    const L = typeof lvl === "function" ? lvl() : null;
    return (L && L.pads.find((p) => p.n === n)) || null;
  }
  function refreshCam() {
    const scale = view.cover ? Math.max(view.vw / W, view.vh / H) : view.scale;
    const visW = view.vw / scale, visH = view.vh / scale;
    let cx = W / 2, cy = H / 2;
    if (visW < W && taxi && mode !== "title" && mode !== "boot") {
      const p = jobPad();
      cx = p ? taxi.x + clamp((p.x + p.w / 2 - taxi.x) * 0.34, -visW * 0.28, visW * 0.28) : taxi.x;
    }
    if (visH < H) {
      let top = 40, bot = H;
      try {
        const ps = lvl() && lvl().pads;
        if (ps && ps.length) {
          top = Math.min(...ps.map((p) => p.y)) - 90;
          bot = Math.max(...ps.map((p) => p.y)) + 24;
        }
      } catch (_) {}
      cy = (top + bot) / 2;
    }
    let camX = cx - visW / 2, camY = cy - visH / 2;
    camX = visW >= W ? (W - visW) / 2 : clamp(camX, 0, W - visW);
    camY = visH >= H ? (H - visH) / 2 : clamp(camY, 0, H - visH);
    view.worldScale = scale;
    view.camX = camX;
    view.camY = camY;
  }
  function applyWorld() {
    const s = view.worldScale;
    ctx.setTransform(view.dpr * s, 0, 0, view.dpr * s, view.dpr * (-view.camX * s), view.dpr * (-view.camY * s));
  }
  function applyUi() {
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  }
  function screenXY(ev) {
    const r = canvas.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }
  function muteBox() {
    return { x: view.vw - 56, y: 12, w: 48, h: 48 };
  }
  function pauseBox() {

  function menuSlot(n, h) {

  function menuRetry() { return menuSlot(0, 56); }
  function menuWatch() { return menuSlot(1, 56); }
  function menuResume() { return menuSlot(0, 56); }
  function menuQuit() { return menuSlot(1, 48); }

  function sdkCall(name, ...args) {

  const GRAV = 58, THRUST = 122, SIDE = 90, DRAG_X = 1.15, DRAG_Y = 0.2;

    {

      walls: [
        [0, 0, 1280, 40], [0, 680, 1280, 40], [0, 40, 320, 640], [960, 40, 320, 640],

      ],
      pads: [
        { n: 1, x: 540, y: 680, w: 200 },

        { n: 3, x: 810, y: 360, w: 140 },
        { n: 4, x: 330, y: 500, w: 140 },
      ],
    },
    {
      name: "Night shift", hook: "Tuck under the roofs.", fares: 4, burn: 1.36, land: 58, magnet: 0,
      sky: ["#140e24", "#07060c"], wall: ["#3a2a52", "#14101c"],
      walls: [
        [0, 0, 1280, 40], [0, 680, 1280, 40], [0, 40, 32, 640], [1248, 40, 32, 640],
        [32, 250, 280, 16], [32, 380, 280, 16], [292, 250, 20, 52],
        [500, 120, 240, 16], [500, 220, 240, 16], [720, 120, 20, 48],
        [980, 380, 268, 16], [980, 500, 268, 16], [980, 380, 20, 48],
      ],
      pads: [
        { n: 1, x: 50, y: 680, w: 120 },
        { n: 2, x: 70, y: 380, w: 120 },
        { n: 3, x: 530, y: 220, w: 120 },
        { n: 4, x: 1020, y: 500, w: 120 },
        { n: 5, x: 1080, y: 680, w: 120 },
      ],
    },
  ];

  const keys = Object.create(null);
  const ptr = { down: false, x: W / 2, y: H / 2, sx: W / 2, sy: H / 2, t: 0 };
  const MUTE = { x: W - 64, y: 10, w: 48, h: 48 };
  const PAUSE_BTN = { x: W - 64, y: 62, w: 48, h: 48 };
  const pausePress = { on: false, t: 0, x: 0, y: 0 };
  const RETRY = { x: W / 2 - 190, y: 418, w: 380, h: 56 };
  const WATCH = { x: W / 2 - 190, y: 488, w: 380, h: 56 };
  const RESUME = { x: W / 2 - 190, y: 300, w: 380, h: 56 };
  const QUIT = { x: W / 2 - 190, y: 368, w: 380, h: 48 };
  const parts = [];
  const pops = [];
  const stars = Array.from({ length: 110 }, () => ({
    x: Math.random() * W, y: 40 + Math.random() * 640, s: 0.4 + Math.random() * 1.4, tw: Math.random() * 6,
  }));

  let mode = "boot", muted = false, userMuted = false, inputOff = false;
  let taxi, fare, score, combo, best, shake, t, flash, runId, deaths;
  let level, faresDone, fuel, banner, bannerT, fareAt, newBest, actx, spin, lives, overWhy, fuelGlow, thrustFx;
  let landTip, hintT, clearT, dockSplash, dockHook, dockSplashT, dryCoast;

  function lvl() { return LEVELS[level]; }
  function pads() { return lvl().pads; }
  function walls() { return lvl().walls; }
  function homePad() { return pads()[0]; }
  function landMax() { return lvl().land || 80; }
  function loadBest() { try { return Number(localStorage.getItem("st_poki_best") || 0); } catch (_) { return 0; } }
  function saveBest(n) { try { localStorage.setItem("st_poki_best", String(n)); } catch (_) {} }
  function loadMute() { try { return localStorage.getItem("st_poki_quiet") === "1"; } catch (_) { return false; } }
  function saveMute(on) { try { localStorage.setItem("st_poki_quiet", on ? "1" : "0"); } catch (_) {} }
  function inBox(p, b) { return p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h; }
  function toggleMute() { userMuted = !userMuted; saveMute(userMuted); if (userMuted) thrustSound(false); }
  function audioCtx() {
    if (muted || userMuted) return null;
    try {
      actx = actx || new AudioContext();
      if (actx.state === "suspended") actx.resume();
      return actx;
    } catch (_) { return null; }
  }
  function tone(freq, dur, type, vol) {
    const ctx = audioCtx();
    if (!ctx) return;
    try {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || "sine"; o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.04, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
      o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + dur);
    } catch (_) {}
  }
  function chord(notes, dur, type) {
    notes.forEach((f, i) => setTimeout(() => tone(f, dur, type || "sine", 0.035), i * 70));
  }
  function thud() {
    const ctx = audioCtx();
    if (!ctx) return;
    try {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.setValueAtTime(140, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(42, ctx.currentTime + 0.16);
      g.gain.setValueAtTime(0.09, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.16);
      o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.16);
    } catch (_) {}
  }
  function noiseHit(vol) {
    const ctx = audioCtx();
    if (!ctx) return;
    try {
      const n = Math.floor(ctx.sampleRate * 0.22), buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const src = ctx.createBufferSource(); src.buffer = buf;
      const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 520;
      const g = ctx.createGain(); g.gain.setValueAtTime(vol || 0.14, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
      src.connect(f); f.connect(g); g.connect(ctx.destination); src.start();
    } catch (_) {}
  }
  function ensureThrustFx() {
    const ctx = audioCtx();
    if (!ctx) return null;
    if (thrustFx && thrustFx.ctx === ctx) return thrustFx;
    const n = ctx.sampleRate, buf = ctx.createBuffer(1, n, n), data = buf.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n * 0.15);
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 140;
    const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 360; bp.Q.value = 0.65;
    const whoosh = ctx.createGain(); whoosh.gain.value = 0.0001;
    src.connect(hp); hp.connect(bp); bp.connect(whoosh); whoosh.connect(ctx.destination);
    const osc = ctx.createOscillator(); osc.type = "sine"; osc.frequency.value = 62;
    const hum = ctx.createGain(); hum.gain.value = 0.0001;
    osc.connect(hum); hum.connect(ctx.destination);
    const spark = ctx.createOscillator(); spark.type = "triangle"; spark.frequency.value = 880;
    const air = ctx.createGain(); air.gain.value = 0.0001;
    spark.connect(air); air.connect(ctx.destination);
    src.start(); osc.start(); spark.start();
    thrustFx = { ctx, bp, whoosh, osc, hum, spark, air };
    return thrustFx;
  }
  function thrustSound(on) {
    if (!on || muted || userMuted) {
      if (!thrustFx) return;
      const now = thrustFx.ctx.currentTime;
      thrustFx.whoosh.gain.setTargetAtTime(0.0001, now, 0.09);
      thrustFx.hum.gain.setTargetAtTime(0.0001, now, 0.1);
      thrustFx.air.gain.setTargetAtTime(0.0001, now, 0.08);
      return;
    }
    const fx = ensureThrustFx();
    if (!fx) return;
    const now = fx.ctx.currentTime, spd = speedNow();
    fx.whoosh.gain.setTargetAtTime(0.05, now, 0.05);
    fx.hum.gain.setTargetAtTime(0.02, now, 0.07);
    fx.air.gain.setTargetAtTime(0.007, now, 0.06);
    fx.bp.frequency.setTargetAtTime(280 + spd * 1.6, now, 0.12);
    fx.osc.frequency.setTargetAtTime(54 + spd * 0.28, now, 0.12);
    fx.spark.frequency.setTargetAtTime(720 + spd * 1.1, now, 0.14);
  }
  function pop(x, y, text, color, life) { pops.push({ x, y, text, color: color || "#fff", life: life || 1 }); }
  function say(text, secs) { banner = text; bannerT = secs || 2; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function lerp(a, b, k) { return a + (b - a) * k; }
  function blockedAt(L, x, y) {
    const box = { x: x - TW / 2 - 8, y: y - 12, w: TW + 16, h: TH + 18 };
    for (const w of L.walls) {
      if (box.x < w[0] + w[2] && box.x + box.w > w[0] && box.y < w[1] + w[3] && box.y + box.h > w[1]) return true;
    }
    return x < 48 || x > W - 48 || y < 56 || y > H - 48;
  }
  function mazeFactor(L) {
    let b = 0, n = 0;
    for (let x = 80; x < W - 80; x += 40) {
      for (let y = 80; y < H - 80; y += 40) {
        n += 1;
        if (blockedAt(L, x, y)) b += 1;
      }
    }
    return b / Math.max(1, n);
  }
  function pathLen(L, ax, ay, bx, by) {
    const CS = 28, cols = Math.ceil(W / CS), rows = Math.ceil(H / CS);
    function snap(x, y) {
      const bi = Math.round(x / CS), bj = Math.round(y / CS);
      let best = null, bestD = 1e9;
      for (let r = 0; r <= 10; r++) {
        for (let dj = -r; dj <= r; dj++) {
          for (let di = -r; di <= r; di++) {
            if (Math.max(Math.abs(di), Math.abs(dj)) !== r) continue;
            const i = bi + di, j = bj + dj, px = i * CS, py = j * CS;
            if (i < 0 || j < 0 || i > cols || j > rows || blockedAt(L, px, py)) continue;
            const d = Math.hypot(px - x, py - y);
            if (d < bestD) { bestD = d; best = { i, j, x: px, y: py }; }
          }
        }
        if (best) return best;
      }
      return { i: bi, j: bj, x, y };
    }
    const s = snap(ax, ay), g = snap(bx, by);
    const key = (i, j) => i + j * 2048;
    const dist = new Map([[key(s.i, s.j), 0]]);
    const heap = [[0, s.i, s.j]];
    const dirs = [];
    for (const di of [-1, 0, 1]) for (const dj of [-1, 0, 1]) {
      if (di || dj) dirs.push([di, dj, Math.hypot(di, dj) * CS]);

      ctx.fillStyle = "#ffe08a"; ctx.font = "700 18px Outfit, sans-serif";
      ctx.fillText("Tap to resume", cx, resume.y + 36);
      glass(quit.x, quit.y, quit.w, quit.h, 16);
      ctx.fillStyle = "rgba(230,236,255,.8)"; ctx.font = "600 16px Outfit, sans-serif";
      ctx.fillText("Quit to menu", cx, quit.y + 32);
    }
    if (mode === "clear") {
      ctx.fillStyle = "rgba(8,9,15,.62)"; ctx.fillRect(0, 0, vw, vh);
      ctx.textAlign = "center";
      ctx.fillStyle = "#fff6d6"; ctx.font = "700 40px Outfit, sans-serif";
      ctx.fillText("Night clear", cx, vh * 0.28);
      ctx.fillStyle = "#7ee0b0"; ctx.font = "700 24px Outfit, sans-serif";
      ctx.fillText("+$100", cx, vh * 0.36);
      ctx.fillStyle = "#ffe08a"; ctx.font = "700 18px Outfit, sans-serif";
      ctx.fillText("Tap to keep flying", cx, vh * 0.7);
    }
    if (mode !== "boot") drawMuteBtn();
    if (mode === "play") drawPauseBtn();
    if (flash > 0) { ctx.fillStyle = `rgba(255,90,70,${flash * 0.45})`; ctx.fillRect(0, 0, vw, vh); }
  }

  function onPtr(ev, down) {
    const p = canvasXY(ev);
    const u = uiXY(ev);
    ptr.x = p.x; ptr.y = p.y; ptr.sx = u.x; ptr.sy = u.y;
    if (adsOn || inputOff) {
      if (down === false) ptr.down = false;
      return;
    }
    if (down === true) {
      if (mode !== "boot" && inBox(u, muteBox())) { toggleMute(); return; }
      if (mode === "play" && inBox(u, pauseBox())) {
        pausePress.on = true; pausePress.t = performance.now(); pausePress.x = u.x; pausePress.y = u.y;
        return;
      }
      if (mode === "pause") {
        if (inBox(u, menuResume())) setPause(false);
        else if (inBox(u, menuQuit())) quitToTitle();
        return;
      }
      if (mode === "clear") { finishClear(); return; }
      if (mode === "over") {
        if (inBox(u, menuRetry())) retryNight();
        else if (inBox(u, menuWatch())) watchContinue();
        return;
      }
      ptr.down = true;
      ptr.t = performance.now();
      if (mode === "title") firstPlay();
    }
    if (down === false) {
      if (pausePress.on) {
        const held = performance.now() - pausePress.t;
        const dist = Math.hypot(u.x - pausePress.x, u.y - pausePress.y);
        if (mode === "play" && held < 320 && dist < 18 && inBox(u, pauseBox())) setPause(true);
        pausePress.on = false;
        ptr.down = false;
        return;
      }
      if (mode === "play" && !adsOn && taxi && hasGas() && performance.now() - ptr.t < 220) {
        const a = aim();
        if (Math.abs(a.ax) > 0.2 || Math.abs(a.ay) > 0.2) {
          if (taxi.landed) {
            if (a.ay < -0.2) { taxi.landed = false; taxi.vy = -TAKEOFF; burn(0.12, true); }
          } else {
            taxi.vx += a.ax * 38;
            taxi.vy += a.ay * 38;
            burn(0.08, true);
          }
        }
      }
      ptr.down = false;
    }
  }
  canvas.addEventListener("pointerdown", (e) => {
    if (adsOn) return;
    e.preventDefault();
    canvas.focus();
    canvas.setPointerCapture(e.pointerId);
    onPtr(e, true);
  });
  canvas.addEventListener("pointermove", (e) => onPtr(e, null));
  canvas.addEventListener("pointerup", (e) => onPtr(e, false));
  canvas.addEventListener("pointercancel", (e) => onPtr(e, false));

  window.addEventListener("keydown", (e) => {
    if (adsOn) return;
    if (["ArrowDown", "ArrowUp", "ArrowLeft", "ArrowRight", "Space"].includes(e.code) || e.key === " " || e.key === "ArrowDown" || e.key === "ArrowUp") e.preventDefault();
    if (inputOff) return;
    keys[e.code] = true;
    if (e.code === "KeyM") { toggleMute(); return; }
    if (e.code === "Escape") {
      if (mode === "play") setPause(true);
      else if (mode === "pause") setPause(false);
      return;
    }
    if (mode === "pause" && (e.code === "Enter" || e.code === "Space")) { setPause(false); return; }
    if (mode === "clear") { finishClear(); return; }
    if (mode === "title") firstPlay();
    if (mode === "over" && (e.code === "Enter" || e.code === "Space")) retryNight();
  });
  window.addEventListener("keyup", (e) => { keys[e.code] = false; });
  window.addEventListener("blur", () => {
    ptr.down = false;
    pausePress.on = false;
    Object.keys(keys).forEach((k) => { keys[k] = false; });
  });
  window.addEventListener("wheel", (e) => e.preventDefault(), { passive: false });
  window.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now; update(dt); draw(); requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
